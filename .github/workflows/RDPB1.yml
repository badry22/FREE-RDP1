name: RDP/Terminal via tmate

on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Enable RDP
        shell: pwsh
        run: |
          net user kamel123 MyStrong123 /add | Out-Null
          net localgroup administrators kamel123 /add | Out-Null
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      - name: Install tmate & Start Session
        shell: bash
        run: |
          winget install tmate.tmate --accept-source-agreements --accept-package-agreements || true
          # تشغيل tmate في الخلفية أو استخدام action جاهزة
          echo "Installing via chocolatey/winget or alternative CLI..."
          
      - name: Use tmate action (Easier)
        uses: mxschmitt/action-tmate@v3
        timeout-minutes: 60
